name: CI

# mainへのpushと、mainに向けたPRのたびに実行する。
# ローカルで確認済みでも、CIは「他の人の環境（まっさらなLinux）でも動くか」を検証する役割を持つ。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint / test / build
    runs-on: ubuntu-latest

    env:
      # このCIではDBに接続しない（テストは純粋関数のみ、ページはforce-dynamicで
      # ビルド時にDBへ接続しない）。ただしprisma.config.tsの読み込み時に
      # 環境変数の存在チェックだけ行われるため、ダミー値を渡す。
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      SHADOW_DATABASE_URL: mysql://ci:ci@localhost:3306/ci

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          # Dockerイメージ（node:24-alpine）と同じメジャーバージョンに揃える。
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        # package-lock.jsonの内容をそのまま入れる（バージョンを勝手に上げない）。
        run: npm ci

      - name: Prisma Clientを生成
        # 型定義（PrismaClientやenum）はここで生成されるため、
        # lint・test・buildより前に必ず実行する必要がある。
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
